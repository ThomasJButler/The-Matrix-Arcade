<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <title>Matrix Bird preview</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="55%" stop-color="#020b02"/>
      <stop offset="100%" stop-color="#001a00"/>
    </linearGradient>
    <linearGradient id="rainCol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00ff00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff00" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#005d00"/>
      <stop offset="30%" stop-color="#00ff33"/>
      <stop offset="70%" stop-color="#00b300"/>
      <stop offset="100%" stop-color="#004a00"/>
    </linearGradient>
    <radialGradient id="birdGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="576" fill="url(#skyGrad)"/>

  <!-- matrix rain columns (static silhouette) -->
  <g opacity="0.9">
    <rect x="48"   y="-40" width="4" height="480" fill="url(#rainCol)"/>
    <rect x="128"  y="-80" width="3" height="540" fill="url(#rainCol)" opacity="0.7"/>
    <rect x="200"  y="-20" width="4" height="420" fill="url(#rainCol)"/>
    <rect x="272"  y="-60" width="3" height="560" fill="url(#rainCol)" opacity="0.6"/>
    <rect x="336"  y="-30" width="4" height="500" fill="url(#rainCol)"/>
    <rect x="408"  y="-90" width="3" height="470" fill="url(#rainCol)" opacity="0.8"/>
    <rect x="480"  y="-50" width="4" height="520" fill="url(#rainCol)"/>
    <rect x="552"  y="-20" width="3" height="480" fill="url(#rainCol)" opacity="0.55"/>
    <rect x="648"  y="-70" width="4" height="540" fill="url(#rainCol)"/>
    <rect x="736"  y="-30" width="3" height="420" fill="url(#rainCol)" opacity="0.7"/>
    <rect x="832"  y="-10" width="4" height="500" fill="url(#rainCol)"/>
    <rect x="920"  y="-80" width="3" height="560" fill="url(#rainCol)" opacity="0.6"/>
  </g>

  <!-- faint scanline overlay -->
  <g opacity="0.22" fill="#000000">
    <rect x="0" y="0"   width="1024" height="2"/>
    <rect x="0" y="8"   width="1024" height="2"/>
    <rect x="0" y="16"  width="1024" height="2"/>
    <rect x="0" y="24"  width="1024" height="2"/>
    <rect x="0" y="32"  width="1024" height="2"/>
    <rect x="0" y="40"  width="1024" height="2"/>
    <rect x="0" y="48"  width="1024" height="2"/>
  </g>

  <!-- pipes: upper + lower pair leaves a gap centered on bird height -->
  <!-- upper pipe -->
  <g>
    <rect x="716" y="0"   width="84" height="210" fill="url(#pipeGrad)"/>
    <rect x="704" y="196" width="108" height="28" fill="url(#pipeGrad)"/>
    <rect x="716" y="0"   width="2"  height="210" fill="#00ff66" opacity="0.65"/>
    <rect x="796" y="0"   width="2"  height="210" fill="#003300"/>
  </g>
  <!-- lower pipe -->
  <g>
    <rect x="716" y="360" width="84" height="160" fill="url(#pipeGrad)"/>
    <rect x="704" y="352" width="108" height="28" fill="url(#pipeGrad)"/>
    <rect x="716" y="360" width="2"  height="160" fill="#00ff66" opacity="0.65"/>
    <rect x="796" y="360" width="2"  height="160" fill="#003300"/>
  </g>

  <!-- far background pipe (dim) -->
  <g opacity="0.35">
    <rect x="928" y="0"   width="60" height="140" fill="url(#pipeGrad)"/>
    <rect x="918" y="128" width="80" height="20"  fill="url(#pipeGrad)"/>
    <rect x="928" y="420" width="60" height="160" fill="url(#pipeGrad)"/>
    <rect x="918" y="412" width="80" height="20"  fill="url(#pipeGrad)"/>
  </g>

  <!-- ground band -->
  <g>
    <rect x="0" y="520" width="1024" height="56" fill="#001a00"/>
    <rect x="0" y="520" width="1024" height="2"  fill="#00ff33" opacity="0.55"/>
    <g fill="#003300">
      <rect x="0"   y="536" width="8" height="4"/>
      <rect x="64"  y="544" width="8" height="4"/>
      <rect x="128" y="540" width="8" height="4"/>
      <rect x="192" y="548" width="8" height="4"/>
      <rect x="256" y="536" width="8" height="4"/>
      <rect x="320" y="544" width="8" height="4"/>
      <rect x="384" y="540" width="8" height="4"/>
      <rect x="448" y="548" width="8" height="4"/>
      <rect x="512" y="536" width="8" height="4"/>
      <rect x="576" y="544" width="8" height="4"/>
      <rect x="640" y="540" width="8" height="4"/>
      <rect x="704" y="548" width="8" height="4"/>
      <rect x="768" y="536" width="8" height="4"/>
      <rect x="832" y="544" width="8" height="4"/>
      <rect x="896" y="540" width="8" height="4"/>
      <rect x="960" y="548" width="8" height="4"/>
    </g>
  </g>

  <!-- bird glow halo -->
  <circle cx="360" cy="280" r="140" fill="url(#birdGlow)"/>

  <!-- pixel bird: mid-flap pose, 16x16 upscaled 16x (256x256) centered at (360,280) -->
  <!-- origin (232, 152) -->
  <g transform="translate(232 152)" shape-rendering="crispEdges">
    <!-- body outline / fill -->
    <g fill="#00b300">
      <rect x="64"  y="48"  width="128" height="16"/>
      <rect x="48"  y="64"  width="160" height="16"/>
      <rect x="32"  y="80"  width="192" height="32"/>
      <rect x="48"  y="112" width="176" height="16"/>
      <rect x="64"  y="128" width="144" height="16"/>
      <rect x="80"  y="144" width="112" height="16"/>
    </g>
    <!-- highlight (top-left) -->
    <g fill="#00ff66">
      <rect x="80"  y="48"  width="64"  height="16"/>
      <rect x="64"  y="64"  width="80"  height="16"/>
      <rect x="48"  y="80"  width="80"  height="16"/>
    </g>
    <!-- beak -->
    <g fill="#9cff33">
      <rect x="208" y="96"  width="32"  height="16"/>
      <rect x="224" y="80"  width="16"  height="16"/>
    </g>
    <!-- eye -->
    <rect x="160" y="72"  width="16" height="16" fill="#ffffff"/>
    <rect x="168" y="80"  width="8"  height="8"  fill="#000000"/>
    <!-- wing (mid-flap, extended down) -->
    <g fill="#008000">
      <rect x="80"  y="112" width="80" height="16"/>
      <rect x="64"  y="128" width="96" height="16"/>
      <rect x="80"  y="144" width="64" height="16"/>
    </g>
    <g fill="#00ff33">
      <rect x="96"  y="128" width="48" height="8"/>
    </g>
    <!-- subtle shadow base -->
    <g fill="#002200">
      <rect x="64"  y="160" width="128" height="8"/>
    </g>
  </g>

  <!-- subtle vignette -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1024" height="576" fill="url(#vignette)"/>
</svg>
